<html lang="ja">
<head>
<meta charset="utf-8">

<title>パルクール試作 v4.1（ルート一望をタップでスキップ）</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; font-family:sans-serif; background:#87b5d6;
    touch-action:none; -webkit-user-select:none; user-select:none; height:100%; }
  canvas { display:block; }
  #map { position:fixed; top:10px; left:10px; width:176px; height:176px; border-radius:14px;
    background:rgba(8,14,20,.78); border:2px solid rgba(255,255,255,.4); z-index:6; pointer-events:auto; cursor:pointer; }
  #bigmap { position:absolute; left:0; top:0; width:100%; height:100%; z-index:40; background:#0a0f14; display:none; }
  #bigmapCanvas { position:absolute; left:0; top:0; width:100%; height:100%; touch-action:none; }
  #bigmapClose { position:absolute; right:12px; top:12px; z-index:42; color:#fff; background:rgba(20,28,36,.92); border:1px solid #5a6a7a; border-radius:999px; padding:10px 18px; font-size:15px; font-weight:bold; }
  .mapbtn { position:absolute; z-index:42; color:#fff; background:rgba(20,28,36,.92); border:1px solid #5a6a7a; border-radius:999px; font-weight:bold; text-align:center; }
  #bigmapHere { left:12px; bottom:14px; padding:10px 16px; font-size:14px; }
  #bigmapZoomIn { right:12px; bottom:76px; width:48px; height:48px; line-height:48px; font-size:24px; border-radius:50%; }
  #bigmapZoomOut { right:12px; bottom:14px; width:48px; height:48px; line-height:48px; font-size:24px; border-radius:50%; }
  #mapInfo { position:fixed; top:194px; left:10px; z-index:6; color:#fff; font-size:13px; font-weight:bold;
    text-shadow:0 1px 3px rgba(0,0,0,.8); pointer-events:none; line-height:1.5; }
  #courseBtn { position:fixed; top:10px; right:10px; z-index:7; padding:9px 13px; font-size:14px; font-weight:bold;
    color:#fff; background:rgba(10,18,26,.72); border:2px solid rgba(255,255,255,.45); border-radius:12px; }
  #courseUI { position:absolute; inset:0; z-index:30; display:flex; align-items:center; justify-content:center;
    background:rgba(5,10,16,.74); }
  .course-card { text-align:center; color:#fff; width:min(420px, 86%); }
  .course-title { font-size:27px; font-weight:bold; margin-bottom:4px; }
  .course-sub { font-size:13px; opacity:.85; margin-bottom:14px; }
  .course-btn { display:block; width:100%; margin:10px 0; padding:15px; font-size:19px; font-weight:bold;
    border-radius:14px; border:2px solid rgba(255,255,255,.5); background:rgba(255,255,255,.12); color:#fff; line-height:1.35; }
  .course-btn small { font-size:12px; font-weight:normal; opacity:.85; }
  .course-btn.sel { border-color:#ffcc00; background:rgba(255,204,0,.18); }
  #result { position:absolute; inset:0; z-index:25; display:none; align-items:center; justify-content:center;

  #resTime { font-size:36px; font-weight:bold; color:#ffcc00; margin:2px 0; }
  #resBest { font-size:15px; margin-bottom:8px; }

    font-size:24px; font-weight:bold; color:#ffcc00; text-shadow:0 2px 6px rgba(0,0,0,.75); opacity:0; white-space:nowrap; }
  #toast.show { animation: toastA 1.25s ease forwards; }
  @keyframes toastA { 0% { opacity:0; transform:translateX(-50%) scale(.8); } 15% { opacity:1; transform:translateX(-50%) scale(1.06); }
    30% { transform:translateX(-50%) scale(1); } 75% { opacity:1; } 100% { opacity:0; } }
  #msg { position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.6); color:#fff; padding:7px 14px; border-radius:20px; font-size:13px; pointer-events:none; z-index:5;
    max-width:92vw; text-align:center; }
  kbd { background:#fff; color:#000; border-radius:4px; padding:0 5px; }
  /* 左スティック */
  #joyBase { position:fixed; width:120px; height:120px; border-radius:50%;
    background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.45);
    display:none; z-index:10; pointer-events:none; transform:translate(-50%,-50%); }
  #joyKnob { position:fixed; width:52px; height:52px; border-radius:50%;
    background:rgba(255,255,255,.55); display:none; z-index:11; pointer-events:none; transform:translate(-50%,-50%); }
  /* 右ボタン */
  .btn { position:fixed; z-index:10; border-radius:50%; border:2px solid rgba(255,255,255,.5);
    background:rgba(0,0,0,.4); color:#fff; display:flex; align-items:center; justify-content:center;
    text-align:center; font-weight:bold; pointer-events:auto; touch-action:none; }
  .btn.on { background:rgba(255,204,0,.55); }
  #btnJump { right:26px; bottom:30px; width:86px; height:86px; font-size:15px; }
  #btnSlide { right:126px; bottom:22px; width:66px; height:66px; font-size:11px; }
  #btnDash { right:36px; bottom:132px; width:66px; height:66px; font-size:11px; }
  #btnRestart { right:14px; top:10px; width:44px; height:44px; font-size:20px; }
  #btnRoll { right:212px; bottom:22px; width:66px; height:66px; font-size:11px; }
  /* ゲーム画面は常に横向き: 縦向き端末では画面ごと90度回転させる */
  #app { position:fixed; left:0; top:0; width:100vw; height:100vh; overflow:hidden; background:#87b5d6; }
  #app canvas { position:absolute; left:0; top:0; }
  @media (orientation: portrait) {
    #app { width:100vh; height:100vw; transform-origin:0 0; transform:translateX(100vw) rotate(90deg); }
  }
</style>

// ジオメトリを1つに結合する（描画回数を激減させる軽量化）
function mergeMeshes(geos, material) {
  const parts = geos.map(g => g.index ? g.toNonIndexed() : g);
  let total = 0;
  for (const g of parts) total += g.attributes.position.count;
  const hasUv = !!parts[0].attributes.uv;
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3);
  const uv = hasUv ? new Float32Array(total * 2) : null;
  let o = 0;
  for (const g of parts) {
    pos.set(g.attributes.position.array, o * 3);
    if (g.attributes.normal) nor.set(g.attributes.normal.array, o * 3);
    if (uv && g.attributes.uv) uv.set(g.attributes.uv.array, o * 2);
    o += g.attributes.position.count;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  if (uv) geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return new THREE.Mesh(geo, material);
}

const buildingChunks = []; // 区画ごとの建物メッシュ（遠方は非表示にする）
const pendingLids = new Map(), pendingWalls = new Map(); // 区画×色 → 屋根面／壁面ジオメトリ
function sliceGeo(geo, start, count) {
  const out = new THREE.BufferGeometry();
  for (const name of ['position', 'normal', 'uv']) {
    const at = geo.attributes[name];
    if (!at) continue;
    out.setAttribute(name, new THREE.BufferAttribute(at.array.slice(start * at.itemSize, (start + count) * at.itemSize), at.itemSize));
  }
  return out;
}
function addBuilding(points, height) {
  const shape = new THREE.Shape();
  points.forEach(([x, z], i) => i ? shape.lineTo(x, -z) : shape.moveTo(x, -z));
  const geo = new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false });
  geo.rotateX(-Math.PI / 2);
  const xs = points.map(p => p[0]), zs = points.map(p => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minZ = Math.min(...zs), maxZ = Math.max(...zs);
  const hash = Math.abs(Math.round(points[0][0] * 31 + points[0][1] * 57 + height * 13));
  const mi = hash % buildingMats.length;
  const sx = Math.max(0, Math.min(3, Math.floor(((minX + maxX) / 2 + 400) / 200)));
  const sz = Math.max(0, Math.min(3, Math.floor(((minZ + maxZ) / 2 + 400) / 200)));
  const key = (sz * 4 + sx) * 16 + mi;
  // 押し出し形状は「蓋（屋根）」と「壁」でグループが分かれているので別々に貯める
  for (const gr of geo.groups) {
    const part = sliceGeo(geo, gr.start, gr.count);
    const map = gr.materialIndex === 0 ? pendingLids : pendingWalls;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(part);
  }
  colliders.push({ pts: points, minX, maxX, minZ, maxZ, top: height });
}
function finalizeBuildings() {
  const keys = new Set([...pendingLids.keys(), ...pendingWalls.keys()]);
  for (const key of keys) {
    const sector = Math.floor(key / 16);
    const bounds = {
      minX: -400 + 200 * (sector % 4), maxX: -200 + 200 * (sector % 4),
      minZ: -400 + 200 * Math.floor(sector / 4), maxZ: -200 + 200 * Math.floor(sector / 4)
    };
    if (pendingWalls.has(key)) {
      const mesh = mergeMeshes(pendingWalls.get(key), buildingMats[key % 16]);
      mesh.castShadow = true; mesh.receiveShadow = true;
      Object.assign(mesh.userData, bounds);
      buildingChunks.push(mesh);
      addCourseObject(mesh);
    }
    if (pendingLids.has(key)) {
      const mesh = mergeMeshes(pendingLids.get(key), roofMat);
      mesh.receiveShadow = true;
      Object.assign(mesh.userData, bounds);
      buildingChunks.push(mesh);
      addCourseObject(mesh);
    }
  }
  pendingLids.clear();
  pendingWalls.clear();
}

// ---- ポリゴン判定（建物の実際の形で当たり判定する） ----
function pointInPoly(x, z, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], zi = pts[i][1], xj = pts[j][0], zj = pts[j][1];
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}
// 点とポリゴンの関係: inside / 境界までの距離d / 最も近い境界点(cx,cz)
function distToPoly(x, z, pts) {
  let d2min = Infinity, cx = x, cz = z;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const ax = pts[j][0], az = pts[j][1], bx = pts[i][0], bz = pts[i][1];
    const dx = bx - ax, dz = bz - az;
    const l2 = dx * dx + dz * dz || 1e-9;
    let t = ((x - ax) * dx + (z - az) * dz) / l2;
    t = Math.max(0, Math.min(1, t));
    const qx = ax + dx * t, qz = az + dz * t;
    const d2 = (x - qx) * (x - qx) + (z - qz) * (z - qz);
    if (d2 < d2min) { d2min = d2; cx = qx; cz = qz; }
  }
  return { inside: pointInPoly(x, z, pts), d: Math.sqrt(d2min), cx, cz };
}
// 屋根の内側で一番「中ほど」の点（スポーン・CP配置用）。L字型の欠け部分を避ける
function interiorPoint(c) {
  if (c.ip) return c.ip;
  let best = null, bestD = -1;
  const N = 6;
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
    const x = c.minX + (c.maxX - c.minX) * i / N;
    const z = c.minZ + (c.maxZ - c.minZ) * j / N;
    const r = distToPoly(x, z, c.pts);
    if (r.inside && r.d > bestD) { bestD = r.d; best = { x, z }; }
  }
  c.ip = best || { x: (c.minX + c.maxX) / 2, z: (c.minZ + c.maxZ) / 2 };
  return c.ip;
}

function buildingHeight(tags) {

}

function buildRoadMesh(segs, mat, y) {
  const pos = [], uv = [], idx = [];

    pos.push(s.ax + px, y, s.az + pz, s.ax - px, y, s.az - pz,

    uv.push(0, 1, 0, 0, l, 0, l, 1);
    idx.push(vi, vi + 2, vi + 1, vi, vi + 3, vi + 2);
    vi += 4;
  }

function addRoads(ways) {

      const s = { ax: w.pts[i][0], az: w.pts[i][1], bx: w.pts[i + 1][0], bz: w.pts[i + 1][1], w: w.w };
      list.push(s); roadSegs.push(s);

// スクランブル交差点の横断歩道（白ゼブラを中心に描く）
function addZebra() {
  const pos = [], idx = [];
  let vi = 0;
  function stripe(cx, cz, len, wid, ang) {
    const c = Math.cos(ang), s = Math.sin(ang);
    const pts = [[-len / 2, -wid / 2], [len / 2, -wid / 2], [len / 2, wid / 2], [-len / 2, wid / 2]]
      .map(([x, z]) => [cx + x * c - z * s, cz + x * s + z * c]);
    for (const [x, z] of pts) pos.push(x, 0.09, z);
    idx.push(vi, vi + 2, vi + 1, vi, vi + 3, vi + 2);
    vi += 4;
  }
  for (let t = -19; t <= 19; t += 3.2) {           // 対角（スクランブルのX字）
    stripe(t * 0.72, t * 0.72, 5.5, 1.3, Math.PI / 4);
    stripe(t * 0.72, -t * 0.72, 5.5, 1.3, -Math.PI / 4);
  }
  for (let t = -18; t <= 18; t += 3.2) {           // 四辺の横断歩道
    stripe(t, -23, 1.3, 6, 0); stripe(t, 23, 1.3, 6, 0);
    stripe(-23, t, 6, 1.3, 0); stripe(23, t, 6, 1.3, 0);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xf2f2f2, side: THREE.DoubleSide })));
}
function distToSeg(px, pz, s) {
  const dx = s.bx - s.ax, dz = s.bz - s.az;
  const l2 = dx * dx + dz * dz || 1;
  let t = ((px - s.ax) * dx + (pz - s.az) * dz) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (s.ax + dx * t), pz - (s.az + dz * t));
}
function plantTrees() {
  const spots = [];

  while (spots.length < 110 && tries < 3000) {
    tries++;
    const x = (Math.random() - 0.5) * 720, z = (Math.random() - 0.5) * 720;
    if (Math.abs(x) < 30 && Math.abs(z) < 30) continue;              // 交差点の真ん中は空ける
    if (colliders.some(c => x > c.minX - 2 && x < c.maxX + 2 && z > c.minZ - 2 && z < c.maxZ + 2)) continue;
    if (roadSegs.some(s => distToSeg(x, z, s) < s.w / 2 + 1.2)) continue;
    spots.push([x, z]);

    new THREE.CylinderGeometry(0.16, 0.24, 1.7, 5),
    new THREE.MeshLambertMaterial({ color: 0x6b4a2f }), spots.length);

    new THREE.IcosahedronGeometry(1.8, 0),
    new THREE.MeshLambertMaterial({ color: 0x4d7c43 }), spots.length);
  const dummy = new THREE.Object3D();
  spots.forEach(([x, z], i) => {

    dummy.position.set(x, 0.85 * sc, z); dummy.scale.setScalar(sc); dummy.rotation.y = Math.random() * 3;
    dummy.updateMatrix(); trunk.setMatrixAt(i, dummy.matrix);

}

// ---- チェックポイント: 屋根の上に黄色い柱を立てる ----
// スタート地点（屋根の上）と、屋根同士の到達可能性
let spawn = { x: 0, z: 40, top: 0, roof: null };
// 到達可能性: スタートの屋根から、地上（高さ5m以下の低い建物に登れる）をハブにして届く屋根を返す
function computeReachable(spawnRoof) {
  const roofs = colliders.filter(c => !c.prop && !c.aux && c.top >= 5 && c.top <= 32);
  const hub = colliders.filter(c => !c.prop && !c.aux && ((c.top >= 1.5 && c.top <= 7.0) || (c.climbable && c.top <= 13))); // 地上から登れる建物（ティックタック約7mまで＋外階段/ベランダ付き）
  const seen = new Set([spawnRoof, ...hub]);
  const queue = [spawnRoof, ...hub];
  const pool = [];
  while (queue.length) {
    const a = queue.shift();
    if (a !== spawnRoof && roofs.includes(a)) pool.push(a);
    for (const b of roofs) if (!seen.has(b) && canGo(a, b)) { seen.add(b); queue.push(b); }
  }
  return pool;
}
function chooseSpawn() {
  const cands = colliders
    .filter(c => !c.prop && !c.aux && c.top >= 7 && c.top <= 16)
    .map(c => ({ c, d: Math.hypot((c.minX + c.maxX) / 2, (c.minZ + c.maxZ) / 2), area: (c.maxX - c.minX) * (c.maxZ - c.minZ) }))
    .filter(o => o.d < 160 && o.area > 50)
    .sort((a, b) => a.d - b.d)
    .slice(0, 8);
  // 中心に近い順ではなく「そこから届く屋根が多い場所」を選ぶ（渋谷はスポーン次第で届く範囲が激変するため）
  let best = null;
  for (const o of cands) {
    const ip0 = interiorPoint(o.c);
    const near = computeReachable(o.c)
      .filter(r => Math.hypot((r.minX + r.maxX) / 2 - ip0.x, (r.minZ + r.maxZ) / 2 - ip0.z) <= 180).length;
    if (!best || near > best.near) best = { c: o.c, near };
    if (near >= 60) break; // 十分大きなクラスタが見つかれば打ち切り（読み込みを速く）
  }
  if (best) {
    const ip = interiorPoint(best.c);
    spawn = { x: ip.x, z: ip.z, top: best.c.top, roof: best.c };
  }
}
function gapBetween(a, b) {
  const dx = Math.max(a.minX - b.maxX, b.minX - a.maxX, 0);
  const dz = Math.max(a.minZ - b.maxZ, b.minZ - a.maxZ, 0);
  return Math.hypot(dx, dz);
}
function canGo(a, b) {
  // 現実のパルクール性能×1.5: 助走ジャンプで届く隙間は最大6.5m、高さは+1.8mまで。
  // 壁が隣り合っていれば壁登りで+5.8mまで。落下は自由（ロールで吸収でき、遠くまで落ちられる）
  const g = gapBetween(a, b), rise = b.top - a.top;
  if (rise <= 0) return g <= (rise <= -4.5 ? 8 : 6.5);
  if (g <= 4.2) return true; // 壁が近い場所では壁キックの連鎖（チムニー）で何メートルでも登れる
  if (rise <= 1.8) return g <= 6.5;
  if (rise <= 5.8) return g <= 1.8;
  return false;
}

function updateLandRing() {

function placeCheckpoints() {

  if (spawn.roof) {
    pool = computeReachable(spawn.roof);

  const picked = [];

  let curRoof = spawn.roof, curPos = { x: spawn.x, z: spawn.z };
  while (spawn.roof && picked.length < 5) {
    let cand = reachableFrom(curRoof).filter(r => r !== spawn.roof && !picked.includes(r));
    const inBand = cand.filter(r => {
      const ip = interiorPoint(r);
      const d = Math.hypot(ip.x - curPos.x, ip.z - curPos.z);
      return d >= 18 && d <= 140;
    });
    if (inBand.length) cand = inBand;
    const low = cand.filter(r => r.top <= 14);
    if (low.length) cand = low;

    for (const r of cand) {
      const ip = interiorPoint(r);
      let dmin = Math.min(...anchors.map(a => Math.hypot(ip.x - a.x, ip.z - a.z)));
      for (const q of picked) { const qp = interiorPoint(q); dmin = Math.min(dmin, Math.hypot(ip.x - qp.x, ip.z - qp.z)); }
      if (dmin > bestScore) { bestScore = dmin; bestR = r; }
    }
    if (!bestR) break;
    picked.push(bestR);
    anchors.push(interiorPoint(bestR));
    curRoof = bestR; curPos = interiorPoint(bestR);
  }
  const ordered = picked.slice();
  // 屋根CPが足りない分は、最後のCPの周りに地上CPを置いて補う
  if (ordered.length < 5) {
    const groundPts = [];
    let tries = 0;
    while (groundPts.length < 5 - ordered.length && tries < 120) {
      tries++;
      const a = Math.random() * Math.PI * 2, d = 35 + Math.random() * 110;
      const gx = curPos.x + Math.cos(a) * d, gz = curPos.z + Math.sin(a) * d;

      if (ok) for (const q of groundPts) if (Math.hypot(gx - q.x, gz - q.z) < 35) { ok = false; break; }

    const ctop = c.ground ? 0 : c.top;

    pillar.material.opacity = 0.5;

    pillar.position.set(x, ctop + 45, z);
    addCourseObject(pillar);
    const ring = new THREE.Mesh(cpRingGeo, cpRingMat.clone());
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(x, ctop + 0.25, z);

  routeLegs = [];
  const rpts = [{ x: spawn.x, z: spawn.z, top: spawn.roof ? spawn.roof.top : 0 }, ...cps.map(c => ({ x: c.x, z: c.z, top: c.top }))];
  const chevGeo = new THREE.ConeGeometry(0.55, 1.4, 4);
  const upVec = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < rpts.length - 1; i++) {
    const a = rpts[i], b = rpts[i + 1];
    const dx = b.x - a.x, dz = b.z - a.z;
    const len = Math.hypot(dx, dz) || 1;
    const leg = new THREE.Group();
    const dir = new THREE.Vector3(dx / len, 0, dz / len);
    const n = Math.max(1, Math.floor(len / 7));

let AC = null;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
addEventListener('pointerdown', ensureAudio, { passive: true });
function tone(f0, f1, dur, type, vol, delay = 0) {
  if (!AC) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const seJump = () => tone(280, 540, 0.09, 'square', 0.035);
const seDash = () => tone(180, 900, 0.14, 'sawtooth', 0.025);
const seClimb = () => { tone(500, 700, 0.06, 'square', 0.035); tone(720, 980, 0.07, 'square', 0.035, 0.06); };
const seLand = () => tone(140, 70, 0.08, 'sine', 0.06);
const seWall = () => tone(320, 230, 0.1, 'sawtooth', 0.018);
const seCP = () => { tone(880, 880, 0.08, 'triangle', 0.05); tone(1174, 1174, 0.08, 'triangle', 0.05, 0.08); tone(1568, 1568, 0.13, 'triangle', 0.05, 0.16); };
const seOrb = () => tone(1180, 1560, 0.09, 'sine', 0.09);
const seGoal = () => { [660, 880, 1108, 1318, 1760].forEach((f, i) => tone(f, f, 0.12, 'triangle', 0.05, i * 0.09)); };
// 風切り音: 落下が速いほど強く・高くなるノイズ（受け身のタイミングを耳で掴むため）
let windNodes = null, windLevel = 0;
function updateWind(dt) {
  if (!AC) return;
  if (!windNodes) {
    const len = Math.floor(AC.sampleRate * 1.2);
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const srcN = AC.createBufferSource(); srcN.buffer = buf; srcN.loop = true;
    const filt = AC.createBiquadFilter(); filt.type = 'bandpass'; filt.frequency.value = 400; filt.Q.value = 0.6;
    const g = AC.createGain(); g.gain.value = 0;
    srcN.connect(filt); filt.connect(g); g.connect(AC.destination);
    srcN.start();
    windNodes = { filt, g };
  }
  const fall = (!onGround && vel.y < -3) ? Math.min(1, (-vel.y - 3) / 18) : 0;
  windLevel += (fall - windLevel) * Math.min(1, dt * 6);
  windNodes.g.gain.value = windLevel * 0.16;
  windNodes.filt.frequency.value = 350 + windLevel * 900;
}

function findWall(pp, feet) {
  for (const c of colliders) {
    if (c.top - feet < 1.6) continue; // 低い縁は壁とみなさない
    if (pp.x < c.minX - 1.2 || pp.x > c.maxX + 1.2 || pp.z < c.minZ - 1.2 || pp.z > c.maxZ + 1.2) continue;
    const r = distToPoly(pp.x, pp.z, c.pts);
    if (r.inside || r.d >= 1.05 || r.d < 0.001) continue;
    return { x: (pp.x - r.cx) / r.d, z: (pp.z - r.cz) / r.d }; // 壁から離れる向き
  }
  return null;
}

// ---- 屋上の小物（室外機など）とネオン看板 ----
const propMats = [0xb9bec6, 0x8f979f, 0xd8d3c8].map(c => new THREE.MeshLambertMaterial({ color: c }));
const signMats = [0x00e5ff, 0xff4d8d, 0xffe14d, 0x7dff6a].map(c => new THREE.MeshBasicMaterial({ color: c }));
const propGeo = new THREE.BoxGeometry(1, 1, 1);
function addProps() {
  let count = 0;
  const propGeos = new Map(), signGeos = new Map();
  const pushBox = (map, mi, cx, cy, cz, sx, sy, sz) => {
    const g = propGeo.clone();
    g.applyMatrix4(new THREE.Matrix4().compose(
      new THREE.Vector3(cx, cy, cz), new THREE.Quaternion(), new THREE.Vector3(sx, sy, sz)));
    if (!map.has(mi)) map.set(mi, []);
    map.get(mi).push(g);
  };
  for (const c of colliders.slice()) {
    if (count > 170) break;
    const w = c.maxX - c.minX, d = c.maxZ - c.minZ;
    if (w < 9 || d < 9 || c.top < 6 || c.top > 30) continue;
    if (Math.random() < 0.35) continue;
    const n = 1 + Math.floor(Math.random() * 2);
    for (let i = 0; i < n; i++) {
      const pw = 1.4 + Math.random() * 1.6, pd = 1.2 + Math.random() * 1.4, ph = 0.9 + Math.random() * 0.9;
      const x = c.minX + 1.6 + Math.random() * Math.max(0.1, w - 3.2 - pw);
      const z = c.minZ + 1.6 + Math.random() * Math.max(0.1, d - 3.2 - pd);
      pushBox(propGeos, count % 3, x + pw / 2, c.top + ph / 2, z + pd / 2, pw, ph, pd);
      colliders.push({ pts: [[x, z], [x + pw, z], [x + pw, z + pd], [x, z + pd]], minX: x, maxX: x + pw, minZ: z, maxZ: z + pd, prop: true, base: c.top, top: c.top + ph });
      count++;
    }
    const cx = (c.minX + c.maxX) / 2, cz = (c.minZ + c.maxZ) / 2;
    if (Math.hypot(cx, cz) < 130 && Math.random() < 0.5) {
      const sw = Math.min(8, w * 0.7), sh = 2.6;
      pushBox(signGeos, count % 4, cx, c.top + sh / 2 + 0.8, c.minZ + 0.4, sw, sh, 0.4);
    }
  }
  for (const [mi, geos] of propGeos) {
    const mesh = mergeMeshes(geos, propMats[mi]);
    mesh.castShadow = true;
    addCourseObject(mesh);
  }
  for (const [mi, geos] of signGeos) addCourseObject(mergeMeshes(geos, signMats[mi]));
}

function addAccessFeatures() {
  // 現実の建物にある「登れる足場」: 外階段とベランダを付ける（真っ平らな壁だけでは現実でも登れない）
  const stairMat = new THREE.MeshLambertMaterial({ color: 0x9aa0a3 });
  const railMat = new THREE.MeshLambertMaterial({ color: 0x40474d });
  const balcMat = new THREE.MeshLambertMaterial({ color: 0x8f979e });
  const box = new THREE.BoxGeometry(1, 1, 1);
  const stairGeos = [], railGeos = [], balcGeos = [];
  const push = (list, cx, cy, cz, sx, sy, sz) => {
    const g = box.clone();
    g.applyMatrix4(new THREE.Matrix4().compose(new THREE.Vector3(cx, cy, cz), new THREE.Quaternion(), new THREE.Vector3(sx, sy, sz)));
    list.push(g);
  };
  const addAux = (x0, z0, x1, z1, top, platform) => {
    colliders.push({ pts: [[x0, z0], [x1, z0], [x1, z1], [x0, z1]], minX: x0, maxX: x1, minZ: z0, maxZ: z1, top, aux: true, platform: !!platform });
  };
  let stairs = 0, balconies = 0;
  const hosts = colliders.slice();
  for (const c of hosts) {
    if (stairs >= 18 && balconies >= 22) break;
    const w = c.maxX - c.minX, d = c.maxZ - c.minZ;
    if (c.top < 5.5 || c.top > 13) continue;
    if (Math.min(w, d) < 6 || Math.max(w, d) < 10) continue;
    if (Math.random() < 0.25) continue;
    // 4辺のうち最も開けた辺を選ぶ
    const sides = [
      { len: w, clear: Infinity, nz: 1, wall: c.maxZ, from: c.minX, dirU: 1, axis: 'x' },
      { len: w, clear: Infinity, nz: -1, wall: c.minZ, from: c.maxX, dirU: -1, axis: 'x' },
      { len: d, clear: Infinity, nx: 1, wall: c.maxX, from: c.maxZ, dirU: -1, axis: 'z' },
      { len: d, clear: Infinity, nx: -1, wall: c.minX, from: c.minZ, dirU: 1, axis: 'z' },
    ];
    for (const s of sides) {
      for (const o of hosts) {
        if (o === c) continue;
        let dist = Infinity;
        if (s.axis === 'x') {
          if (Math.min(c.maxX, o.maxX) - Math.max(c.minX, o.minX) <= 1) continue;
          dist = s.nz > 0 ? o.minZ - c.maxZ : c.minZ - o.maxZ;
        } else {
          if (Math.min(c.maxZ, o.maxZ) - Math.max(c.minZ, o.minZ) <= 1) continue;
          dist = s.nx > 0 ? o.minX - c.maxX : c.minX - o.maxX;
        }
        if (dist >= 0 && dist < s.clear) s.clear = dist;
      }
    }
    sides.sort((a, b) => b.clear - a.clear);
    const s = sides[0];
    // u=壁に沿う座標, v=壁から外への距離 → ワールドの矩形 [x0,z0,x1,z1]
    const rect = (u0, u1, v0, v1) => {
      if (s.axis === 'x') {
        const x0 = s.dirU > 0 ? s.from + u0 : s.from - u1;
        const x1 = s.dirU > 0 ? s.from + u1 : s.from - u0;
        const z0 = s.nz > 0 ? s.wall + v0 : s.wall - v1;
        const z1 = s.nz > 0 ? s.wall + v1 : s.wall - v0;
        return [x0, z0, x1, z1];
      }
      const z0 = s.dirU > 0 ? s.from + u0 : s.from - u1;
      const z1 = s.dirU > 0 ? s.from + u1 : s.from - u0;
      const x0 = s.nx > 0 ? s.wall + v0 : s.wall - v1;
      const x1 = s.nx > 0 ? s.wall + v1 : s.wall - v0;
      return [x0, z0, x1, z1];
    };
    const put = (list, u0, u1, v0, v1, y0, y1) => {
      const [x0, z0, x1, z1] = rect(u0, u1, v0, v1);
      push(list, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2, x1 - x0, y1 - y0, z1 - z0);
      return [x0, z0, x1, z1];
    };
    const N = Math.ceil(c.top / 0.32);
    const f1 = Math.ceil(N / 2);
    const runLen = f1 * 0.8 + 1.7;
    if (false) { // 外階段は廃止（2026-11-15 ユーザー指示で撤去）。足場はベランダのみ
      // 外階段（往復型）: 1段 0.32m 上がり、踏面 0.8m、歩いて登れる
      const uStart = 1.0;
      let topF = 0;
      for (let i = 0; i < f1; i++) {
        topF = Math.min(c.top, 0.32 * (i + 1));
        const [x0, z0, x1, z1] = put(stairGeos, uStart + i * 0.8, uStart + i * 0.8 + 0.84, 0.02, 1.07, 0, topF);
        addAux(x0, z0, x1, z1, topF, false);
        if (i % 2 === 1) put(railGeos, uStart + i * 0.8 - 0.8, uStart + i * 0.8 + 0.84, 1.0, 1.07, topF + 0.5, topF + 0.58);
      }
      // 中間踊り場
      const landU = uStart + f1 * 0.8;
      const [lx0, lz0, lx1, lz1] = put(stairGeos, landU, landU + 1.7, 0.02, 2.2, 0, topF);
      addAux(lx0, lz0, lx1, lz1, topF, false);
      // 2段目: 外側レーンを逆向きに登る
      let prevTop = topF, j = 0;
      while (c.top - prevTop > 0.34) {
        const nt = Math.min(c.top, prevTop + 0.32);
        const u1 = landU - j * 0.8, u0 = u1 - 0.84;
        if (u0 < uStart - 0.1) break;
        const [x0, z0, x1, z1] = put(stairGeos, u0, u1, 1.15, 2.2, 0, nt);
        addAux(x0, z0, x1, z1, nt, false);
        prevTop = nt; j++;
      }
      // 屋根へ渡る上部踊り場（屋根と同じ高さ）
      const [tx0, tz0, tx1, tz1] = put(stairGeos, uStart - 0.9, uStart + 0.8, 0.02, 2.2, 0, c.top);
      addAux(tx0, tz0, tx1, tz1, c.top, false);
      c.climbable = true;
      stairs++;
    } else if (s.clear >= 1.35 && balconies < 22) {
      // ベランダ2段（下段・上段）＋手すり。ジャンプ＋つかみで段々に登る
      const uC = s.len / 2;
      for (const fr of [0.45, 0.78]) {
        const bt = Math.round(c.top * fr * 10) / 10;
        const [x0, z0, x1, z1] = put(balcGeos, uC - 1.3, uC + 1.3, 0.02, 1.17, bt - 0.18, bt);
        addAux(x0, z0, x1, z1, bt, true);
        put(railGeos, uC - 1.3, uC + 1.3, 1.1, 1.17, bt + 0.5, bt + 0.57);
        put(railGeos, uC - 1.3, uC - 1.22, 0.02, 1.17, bt + 0.5, bt + 0.57);
        put(railGeos, uC + 1.22, uC + 1.3, 0.02, 1.17, bt + 0.5, bt + 0.57);
      }
      c.climbable = true;
      balconies++;
    }
  }
  if (stairGeos.length) { const m = mergeMeshes(stairGeos, stairMat); m.castShadow = true; addCourseObject(m); }
  if (balcGeos.length) { const m = mergeMeshes(balcGeos, balcMat); m.castShadow = true; addCourseObject(m); }
  if (railGeos.length) addCourseObject(mergeMeshes(railGeos, railMat));
}

function applySpawn() {
  player.position.set(spawn.x, spawn.top + 0.95, spawn.z);
  vel.set(0, 0, 0);
  facing = Math.atan2(-spawn.x, -spawn.z);
  player.rotation.y = facing;
  camYaw = facing + Math.PI;
  camPitch = 0.32;
}

function pressRoll() {
  rollBuf = 0.25; // 着地直前の入力を覚える（タイミング受け身）
  if (onGround && rollT <= 0 && slideTime <= 0 && recoverT <= 0) {
    const sp = Math.hypot(vel.x, vel.z);
    if (sp <= 3) { vel.x = Math.sin(facing) * 5; vel.z = Math.cos(facing) * 5; }
    rollT = 0.0001; rollDur = 0.45;
    rollBuf = 0;
    trick('ロール', 30, 'roll', 2);
  }
}

function respawnToCp() {
  // 落ちても最初からやり直しにしない: 最後に通過したCP（なければスタート）へ戻る。タイマーは止まらない
  if (finished || !cps.length) { reset(); return; }
  const tgt = cpIndex > 0 ? cps[cpIndex - 1] : null;
  const x = tgt ? tgt.x : spawn.x, z = tgt ? tgt.z : spawn.z;
  const top = tgt ? tgt.top : (spawn.roof ? spawn.roof.top : 0);
  player.position.set(x, top + 0.9, z);
  vel.set(0, 0, 0);
  slideTime = 0; rollT = 0; recoverT = 0; pendingRecover = 0; climbT = 0; hangT = 0; vaultT = 0; wallRun = 0; dashTime = 0;
  onGround = true;
  const nxt = cps[cpIndex];
  if (nxt) { facing = Math.atan2(nxt.x - x, nxt.z - z); player.rotation.y = facing; camYaw = facing + Math.PI; }
  showToast(tgt ? 'CP' + cpIndex + ' から再開（タイムは継続）' : 'スタート地点から再開（タイムは継続）');
}

  for (const o of orbs) { o.taken = false; o.mesh.visible = true; }
  orbsGot = 0; updateOrbHud();

    const legs = []; let acc = 0;
    for (let i = 0; i < wps.length - 1; i++) {
      const d = Math.hypot(wps[i + 1].x - wps[i].x, wps[i + 1].z - wps[i].z);
      const lt = Math.min(2.2, Math.max(0.9, d / 28));
      legs.push({ a: wps[i], b: wps[i + 1], t0: acc, t1: acc + lt });
      acc += lt;
    }
    if (legs.length) { flyover = { t: 0, dur: acc, legs }; showToast('ルート確認中…（画面タップでスキップ）'); }
  }

  ghost.visible = false;
}

function tryWallKick() {
  // 空中で壁の近くでジャンプすると壁を蹴って跳び返る。狭い隙間では左右の壁を交互に蹴って登れる（チムニー登り）
  const pp = player.position, feet = pp.y - 0.9;
  const range = vel.y < -2 ? 1.9 : 1.6; // 落下中はタイミングがシビアなので判定を広めに取る
  let best = null;
  for (const c of colliders) {
    if (c.prop || c.aux) continue; // 蹴れるのは建物の壁だけ（ベランダ等の足場は対象外）
    if (c.top - feet <= 4.2) continue; // つかめる高さの縁はよじ登りを優先。蹴るのは「高すぎて登れない壁」だけ
    if (pp.x < c.minX - 2.1 || pp.x > c.maxX + 2.1 || pp.z < c.minZ - 2.1 || pp.z > c.maxZ + 2.1) continue;
    const r = distToPoly(pp.x, pp.z, c.pts);
    if (r.inside || r.d < 0.15 || r.d > range) continue;
    if (!best || r.d < best.d) best = { d: r.d, nx: (pp.x - r.cx) / r.d, nz: (pp.z - r.cz) / r.d, c };
  }
  if (!best) return false;
  // チムニーは向かいの壁があって初めて成立する。単独の壁は蹴れない（壁と壁の隙間だけ）
  let chimney = false;
  for (const c2 of colliders) {
    if (c2 === best.c || c2.prop || c2.aux) continue;
    if (c2.top - feet <= 2.5) continue;
    if (pp.x < c2.minX - 2.6 || pp.x > c2.maxX + 2.6 || pp.z < c2.minZ - 2.6 || pp.z > c2.maxZ + 2.6) continue;
    const r2 = distToPoly(pp.x, pp.z, c2.pts);
    if (r2.inside || r2.d < 0.1) continue;
    const m2x = (r2.cx - pp.x) / r2.d, m2z = (r2.cz - pp.z) / r2.d;
    if (m2x * best.nx + m2z * best.nz < 0.6) continue; // 蹴った先（正面）に壁があるか
    if (best.d + r2.d <= 4.8) { chimney = true; break; } // 壁同士の間隔が約4.8m以内なら隙間とみなす
  }
  if (!chimney) return false;
  const toward = Math.max(0, -(vel.x * best.nx + vel.z * best.nz)); // 壁へ向かう勢いは高さに変換する
  vel.y = 9.2 + Math.min(1.3, toward * 0.18); // 1回のキックで約2.1m上がる。交互に蹴ればどんどん登れる
  vel.x = best.nx * 5.4 + vel.x * 0.25;
  vel.z = best.nz * 5.4 + vel.z * 0.25;
  airPush = 0.25;
  kickT = 0.28; kickCd = 0.18;
  facing = Math.atan2(vel.x, vel.z); player.rotation.y = facing; // 蹴った向きに体を向ける
  seJump();
  return true;
}

function step(dt) {
  if (mapOpen) { if (started && !finished) startTime += dt * 1000; return; } // 全体マップを開いている間はタイマーを止める
  // スタート前のルート一望カメラ: 順路の上空を流れる。操作されたら即スタート
  if (flyover) {
    if (wantJump || wantSlide || wantDash || Math.hypot(joy.x, joy.y) > 0.3 || keys.Space || keys.KeyW) { flyover = null; return; }
    flyover.t += dt;
    if (flyover.t >= flyover.dur) { flyover = null; return; }
    const posAt = (tt) => {
      const t = Math.max(0, Math.min(flyover.dur, tt));
      for (const leg of flyover.legs) {
        if (t <= leg.t1 || leg === flyover.legs[flyover.legs.length - 1]) {
          const u = Math.min(1, Math.max(0, (t - leg.t0) / (leg.t1 - leg.t0)));
          const s = u * u * (3 - 2 * u);
          return { x: leg.a.x + (leg.b.x - leg.a.x) * s, y: leg.a.top + (leg.b.top - leg.a.top) * s, z: leg.a.z + (leg.b.z - leg.a.z) * s };
        }
      }
      const last = flyover.legs[flyover.legs.length - 1].b;
      return { x: last.x, y: last.top, z: last.z };
    };
    const fp0 = posAt(flyover.t), fp1 = posAt(flyover.t + 1.1);
    camera.position.set(fp0.x, fp0.y + 7, fp0.z);
    camera.lookAt(fp1.x, fp1.y + 1.2, fp1.z);
    return;
  }
  stepTick++;
  const speed = dashTime > 0 ? 13 : 10; // 現実の走速×1.5（通常10、スプリント13）
  // 入力ベクトル（キーボード＋スティック合算）
  let inX = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + joy.x;
  let inF = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) - joy.y;
  let len = Math.hypot(inX, inF);
  if (len > 1) { inX /= len; inF /= len; len = 1; }
  // カメラ基準の前方向・右方向
  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);
  const rx = -fz, rz = fx;
  let mvx = fx * inF + rx * inX, mvz = fz * inF + rz * inX;
  const moving = len > 0.08;
  if (moving) {
    const target = Math.atan2(mvx, mvz);
    let diff = target - facing;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    facing += diff * Math.min(1, dt * 14);
    player.rotation.y = facing;
  }

  // タイマー
  if (dashCooldown > 0) dashCooldown -= dt;
  if (comboT > 0) { comboT -= dt; if (comboT <= 0 && combo > 0) { combo = 0; updateScoreHud(); } }
  for (const k in trickCd) if (trickCd[k] > 0) trickCd[k] -= dt;
  if (onGround) { airSteps = 0; jumpCutPending = false; }
  if (dashTime > 0) dashTime -= dt;
  if (slideTime > 0) slideTime -= dt;
  if (wallRunCd > 0) wallRunCd -= dt;
  if (kickCd > 0) kickCd -= dt;
  if (kickT > 0) kickT -= dt;
  if (jumpBuf > 0) jumpBuf -= dt;
  if (rollBuf > 0) rollBuf -= dt;
  if (onGround) coyote = 0.12; else if (coyote > 0) coyote -= dt; // 縁を離れた直後0.12秒は地面ジャンプが効く
  if (landDip > 0) landDip -= dt;
  if (recoverT > 0) recoverT -= dt;
  if (rollT > 0) {
    rollT += dt / rollDur;
    if (rollT >= 1) {
      rollT = 0;
      if (pendingRecover > 0) { recoverT = pendingRecover; pendingRecover = 0; vel.x *= 0.3; vel.z *= 0.3; }
    }
  }

  // アクション開始
  if (wantDash && dashCooldown <= 0) {
    dashTime = 0.85; dashCooldown = 1.4; // ダッシュは「スプリント」に変更（速度13で0.85秒）
    seDash();
    if (slideTime > 0) { slideTime = 0;  }
  }
  if (wantSlide && onGround && slideTime <= 0 && dashTime <= 0) {
    slideTime = 0.55;
    if (Math.hypot(vel.x, vel.z) >= 4) trick('スライディング', 30, 'slide', 2);
    if (moving) { const l = Math.hypot(mvx, mvz) || 1; slideDirX = mvx / l; slideDirZ = mvz / l; }
    else { slideDirX = Math.sin(facing); slideDirZ = Math.cos(facing); }
    
  }
  if (wantJump || jumpBuf > 0) {
    if (onGround || coyote > 0) {
      // ティックタック: 壁に向かって走ってジャンプすると、壁を蹴って高く跳ぶ（現実の壁登りの足の動き）
      let ticTac = false;
      if (Math.hypot(vel.x, vel.z) >= 4) {
        const pp0 = player.position, feet0 = pp0.y - 0.9;
        for (const c of colliders) {
          if (c.top - feet0 < 1.8) continue;
          if (pp0.x < c.minX - 1.4 || pp0.x > c.maxX + 1.4 || pp0.z < c.minZ - 1.4 || pp0.z > c.maxZ + 1.4) continue;
          const r = distToPoly(pp0.x, pp0.z, c.pts);
          if (r.inside || r.d > 2.2 || r.d < 0.001) continue; // 壁の2.2m手前からのジャンプでもティックタック成立
          const nx = (pp0.x - r.cx) / r.d, nz = (pp0.z - r.cz) / r.d;
          if (vel.x * nx + vel.z * nz < -3) { ticTac = true; break; }
        }
      }
      vel.y = ticTac ? 11 : (Math.hypot(vel.x, vel.z) < 2 ? 6.3 : 8.0); // ティックタック時は足の蹴りで約3.0mまで跳ぶ
      onGround = false;
      jumpBuf = 0; coyote = 0;
      seJump();
      jumpCutDone = false; airSteps = 0;
      if (ticTac) trick('ティックタック', 150);
      if (slideTime > 0) { slideTime = 0; const hs = Math.hypot(vel.x, vel.z); if (hs > 1) { const b = Math.min(1.12, 14 / hs); vel.x *= b; vel.z *= b; } trick('スライドジャンプ', 60); }
    } else if (wallRun > 0) {
      // 壁ジャンプ: 壁から離れる向きへ跳び出す
      vel.y = 7.5;
      jumpCutDone = false; airSteps = 0;
      vel.x = wallNX * 7 + vel.x * 0.35;
      vel.z = wallNZ * 7 + vel.z * 0.35;
      wallRun = 0;
      jumpBuf = 0;
      airPush = 0.22;
      seJump();
      if (slideTime > 0) { slideTime = 0;  }
    } else if (kickCd <= 0 && tryWallKick()) {
      // 壁キック成立（速度は tryWallKick 内で設定済み）。狭い隙間で交互に蹴れば高い所まで登れる
      jumpCutDone = false; airSteps = 0;
      trick('壁キック', 120);
      jumpBuf = 0;
      if (slideTime > 0) { slideTime = 0; }
    } else if (climbT <= 0) {
      // 空中ジャンプ＝壁のよじ登り（近くの屋根の縁をつかんで、滑らかに登る）
      const pp = player.position, feetNow = pp.y - 0.9;
      for (const c of colliders) {
        if (pp.x < c.minX - 1.3 || pp.x > c.maxX + 1.3 || pp.z < c.minZ - 1.3 || pp.z > c.maxZ + 1.3) continue;
        const rise = c.top - feetNow;
        const hSpdC = Math.hypot(vel.x, vel.z);
        if (rise < 0.4 || rise > (hSpdC >= 4 ? 4.2 : 2.6)) continue; // つかめる高さ（助走あり4.2m、なし2.6m）
        const r = distToPoly(pp.x, pp.z, c.pts);
        if (!r.inside && r.d > 1.15) continue;
        let tx = pp.x, tz = pp.z;
        if (!r.inside && r.d > 0.001) {
          // 最も近い縁から内側へ0.55m入った位置に立つ
          const il = Math.hypot(r.cx - pp.x, r.cz - pp.z) || 1;
          tx = r.cx + (r.cx - pp.x) / il * 0.55;
          tz = r.cz + (r.cz - pp.z) / il * 0.55;
        }
        climbFrom.x = pp.x; climbFrom.y = pp.y; climbFrom.z = pp.z;
        climbTo.x = tx; climbTo.y = c.top + 0.9; climbTo.z = tz;
        facing = Math.atan2(tx - pp.x, tz - pp.z); player.rotation.y = facing;
        climbDur = 0.45 + rise * 0.12; // クライムアップは一瞬ではない（約0.5〜0.85秒）
        climbT = 0.0001;
        if (rise >= 2.0) trick('クライムアップ', 80);
        jumpBuf = 0;
        vel.x = 0; vel.y = 0; vel.z = 0;
        seClimb();
        if (slideTime > 0) { slideTime = 0;  }
        break;
      }
    }
  }
  wantJump = false; wantSlide = false; wantDash = false;

  // ヴォルト: 走って低い障害物（屋上の小物）に近づいたら自動で飛び越える（現実のヴォルトは高さ約1.8mまで）
  if (onGround && vaultT <= 0 && climbT <= 0 && hangT <= 0) {
    const hSpd = Math.hypot(vel.x, vel.z);
    if (hSpd >= 5) {
      const pp = player.position, feet = pp.y - 0.9;
      for (const c of colliders) {
        if (!c.prop) continue;
        if (Math.abs(feet - c.base) > 0.35) continue;
        const ph = c.top - c.base;
        if (ph < 0.5 || ph > 1.8) continue;
        if (pp.x < c.minX - 0.9 || pp.x > c.maxX + 0.9 || pp.z < c.minZ - 0.9 || pp.z > c.maxZ + 0.9) continue;
        const r = distToPoly(pp.x, pp.z, c.pts);
        if (r.inside || r.d > 0.85) continue;
        const nx = (pp.x - r.cx) / r.d, nz = (pp.z - r.cz) / r.d;
        if (vel.x * nx + vel.z * nz > -3) continue; // 障害物に向かっていない
        const dirx = vel.x / hSpd, dirz = vel.z / hSpd;
        const txe = Math.abs(dirx) > 0.01 ? ((dirx > 0 ? c.maxX + 0.8 : c.minX - 0.8) - pp.x) / dirx : Infinity;
        const tze = Math.abs(dirz) > 0.01 ? ((dirz > 0 ? c.maxZ + 0.8 : c.minZ - 0.8) - pp.z) / dirz : Infinity;
        const tExit = Math.min(txe, tze);
        if (!isFinite(tExit) || tExit < 0) continue;
        vaultFrom.x = pp.x; vaultFrom.y = pp.y; vaultFrom.z = pp.z;
        vaultTo.x = pp.x + dirx * (tExit + 0.3); vaultTo.y = c.base + 0.9; vaultTo.z = pp.z + dirz * (tExit + 0.3);
        vaultArc = ph + 0.15; vaultDirX = dirx; vaultDirZ = dirz; vaultSpeed = hSpd * 0.92;
        vaultDur = Math.min(0.5, Math.max(0.34, 0.3 + tExit * 0.03));
        vaultT = 0.0001;
        trick('ヴォルト', 100);
        seDash();
        break;
      }
    }
  }

  // よじ登り中: 目標位置まで滑らかに移動する（この間は物理演算を止める）
  if (climbT > 0) {
    climbT += dt / climbDur;
    const t = Math.min(1, climbT), e = 1 - Math.pow(1 - t, 3);
    player.position.x = climbFrom.x + (climbTo.x - climbFrom.x) * e;
    player.position.y = climbFrom.y + (climbTo.y - climbFrom.y) * e;
    player.position.z = climbFrom.z + (climbTo.z - climbFrom.z) * e;
    vel.x = 0; vel.y = 0; vel.z = 0;
    if (t >= 1) { climbT = 0; onGround = true; vel.x = Math.sin(facing) * 0.4; vel.z = Math.cos(facing) * 0.4; vel.y = 0; } // 登り切った直後の速度はほぼ0（現実のクライムアップ）
  }

  // キャットリープのぶら下がり → そのままクライムアップへ
  if (hangT > 0) {
    hangT += dt / hangDur;
    const t = Math.min(1, hangT), e = 1 - Math.pow(1 - t, 2);
    player.position.x = hangFrom.x + (hangPos.x - hangFrom.x) * e;
    player.position.y = hangFrom.y + (hangPos.y - hangFrom.y) * e;
    player.position.z = hangFrom.z + (hangPos.z - hangFrom.z) * e;
    vel.x = 0; vel.y = 0; vel.z = 0;
    if (t >= 1 && hangC) {
      const c = hangC;
      hangT = 0; hangC = null;
      climbFrom.x = hangPos.x; climbFrom.y = hangPos.y; climbFrom.z = hangPos.z;
      climbTo.x = hangPos.x - hangNX * 0.95; climbTo.y = c.top + 0.9; climbTo.z = hangPos.z - hangNZ * 0.95;
      climbDur = 0.55; climbT = 0.0001;
      seClimb();
    }
  }

  // ヴォルト中: 障害物を放物線で飛び越える
  if (vaultT > 0) {
    vaultT += dt / vaultDur;
    const t = Math.min(1, vaultT);
    player.position.x = vaultFrom.x + (vaultTo.x - vaultFrom.x) * t;
    player.position.z = vaultFrom.z + (vaultTo.z - vaultFrom.z) * t;
    player.position.y = vaultFrom.y + (vaultTo.y - vaultFrom.y) * t + Math.sin(t * Math.PI) * vaultArc;
    vel.x = 0; vel.y = 0; vel.z = 0;
    if (t >= 1) { vaultT = 0; onGround = true; vel.x = vaultDirX * vaultSpeed; vel.z = vaultDirZ * vaultSpeed; }
  }

  // 水平速度
  if (slideTime > 0) {
    const s = speed + 4 * (slideTime / 0.55);
    vel.x = slideDirX * s; vel.z = slideDirZ * s;
  } else if (airPush > 0) {
    airPush -= dt; // 壁ジャンプ直後は勢いを維持（入力で上書きしない）
  } else if (recoverT > 0) {
    vel.x *= Math.max(0, 1 - 10 * dt); vel.z *= Math.max(0, 1 - 10 * dt); // 大きな着地の硬直中は止まる
  } else if (rollT > 0) {
    // ロール中は勢いを維持する（現実のロールは速度を殺さない）
  } else if (!onGround) {
    // 空中は慣性が主。入力で少しだけ進路を寄せられる
    if (moving) {
      const cur = Math.hypot(vel.x, vel.z);
      const tgt = Math.max(cur, speed);
      const k = Math.min(1, 3.2 * dt);
      vel.x += (mvx * tgt - vel.x) * k;
      vel.z += (mvz * tgt - vel.z) * k;
    }
  } else {
    // 地上は加減速をなめらかにする（速度が一瞬で切り替わると操作がカクついて感じる）
    const rate = moving ? 9 : 13;
    const k = 1 - Math.exp(-rate * dt);
    vel.x += (mvx * speed - vel.x) * k;
    vel.z += (mvz * speed - vel.z) * k;
  }
  if ((moving || slideTime > 0 || dashTime > 0) && !started && !finished) { started = true; startTime = performance.now(); }

  const p = player.position;
  if (climbT <= 0 && hangT <= 0 && vaultT <= 0) {
  // 壁走り: 空中で壁沿いを速く進んでいるときだけ成立（現実×1.5でも合計約5.2m・約1.3秒が限界）
  if (onGround) wallRun = 0;
  if (!onGround && vel.y <= 5 && wallRunCd <= 0) {
    const n = findWall(player.position, player.position.y - 0.9);
    let refreshed = false;
    if (n) {
      const along = Math.abs(vel.x * -n.z + vel.z * n.x);
      if (along >= 5) {
        if (wallRun <= 0) { seWall(); wallRunDist = 0; trick('壁走り', 100); }
        wallRun = 1.3; wallNX = n.x; wallNZ = n.z;
        refreshed = true;
      }
    }
    // 壁が無くなったら滑空はすぐ終わらせる（建物のない空中を進み続けないように）
    if (!refreshed && wallRun > 0.25) wallRun = 0.25;
  }
  if (wallRun > 0) {
    wallRun -= dt;
    wallRunDist += Math.hypot(vel.x, vel.z) * dt;
    if (wallRunDist > 5.2) { wallRun = 0; wallRunCd = 0.45; } // 壁走りの距離上限
    vel.y -= 5 * dt;                    // 落下を大幅に弱める
    if (vel.y < -1.2) vel.y = -1.2;
    vel.x += -wallNX * 3 * dt;          // 壁へ軽く吸着
    vel.z += -wallNZ * 3 * dt;
  } else {
    airSteps++;
    if (jumpCutPending) {
      jumpCutPending = false;
      if (!jumpCutDone && vel.y > 3.5 && climbT <= 0 && hangT <= 0 && vaultT <= 0) { vel.y *= 0.45; jumpCutDone = true; }
    }
    vel.y -= 20 * dt;
  }
  if (vel.y < -26) vel.y = -26; // 落下速度の上限

  // キャットリープ: 空中で壁の縁に飛びついたら自動でつかまる（ぶら下がり→クライムアップ）
  if (!onGround && vel.y < 8) {
    const pp = p, feet = pp.y - 0.9;
    const grabMax = Math.hypot(vel.x, vel.z) >= 4 ? 4.2 : 2.6; // 勢いがあるほど高い縁をつかめる
    for (const c of colliders) {
      if (pp.x < c.minX - 1.0 || pp.x > c.maxX + 1.0 || pp.z < c.minZ - 1.0 || pp.z > c.maxZ + 1.0) continue;
      const rise = c.top - feet;
      if (rise < 0.5 || rise > grabMax) continue;
      const r = distToPoly(pp.x, pp.z, c.pts);
      if (r.inside || r.d < 0.2 || r.d > 1.0) continue;
      const nx = (pp.x - r.cx) / r.d, nz = (pp.z - r.cz) / r.d;
      if (vel.x * nx + vel.z * nz > -1.2) continue; // 壁に向かって飛んでいない
      hangFrom.x = pp.x; hangFrom.y = pp.y; hangFrom.z = pp.z;
      hangPos.x = r.cx + nx * 0.38; hangPos.y = c.top - 1.05; hangPos.z = r.cz + nz * 0.38;
      hangC = c; hangNX = nx; hangNZ = nz;
      hangT = 0.0001;
      facing = Math.atan2(-nx, -nz); player.rotation.y = facing;
      vel.set(0, 0, 0);
      seClimb();
      break;
    }
  }

  const FOOT_R = 0.22; // 足の広がり（速く落下中に縁へ足が届いたら着地になる。歩いて踏み外した直後は速度が小さいので拾わない＝ちゃんと落ちる）
  const wasGround = onGround, vyBefore = vel.y;
  // 移動を小刻みに分割する（速く落ちたフレームで屋根をすり抜け、
  // 横に弾かれて瞬間移動したように見える問題への対策）
  const maxMove = Math.max(Math.abs(vel.x), Math.abs(vel.y), Math.abs(vel.z)) * dt;
  const steps = Math.max(1, Math.min(10, Math.ceil(maxMove / 0.3)));
  const sdt = dt / steps;
  for (let s = 0; s < steps; s++) {
    const prevFeet = p.y - 0.9;
    p.x += vel.x * sdt; p.z += vel.z * sdt; p.y += vel.y * sdt;
    onGround = false;
    if (p.y <= 0.9) { p.y = 0.9; vel.y = 0; onGround = true; }
    for (const c of colliders) {
      if (p.x < c.minX - 0.8 || p.x > c.maxX + 0.8 || p.z < c.minZ - 0.8 || p.z > c.maxZ + 0.8) continue;
      if (c.platform && prevFeet < c.top - 2.0) continue; // バルコニーの下は素通りできる
      const r = distToPoly(p.x, p.z, c.pts);
      if (!r.inside && r.d >= 0.55) continue;      // 建物の形から半径分以上離れている
      const feetI = p.y - 0.9;
      if (prevFeet >= c.top - 0.05) {
        // 直前まで屋根より上にいた → 横には弾かず、屋根面を跨いだら着地させる
        // （足場は建物の真上だけ。縁の外の空中には立たせない）
        if (vel.y <= 0 && feetI <= c.top + 0.02 && (r.inside || (vyBefore <= -3 && r.d <= FOOT_R))) {
          if (!r.inside && r.d > 0.001) { p.x = r.cx + (r.cx - p.x) / r.d * 0.03; p.z = r.cz + (r.cz - p.z) / r.d * 0.03; } // 中心を縁の内側へ寄せる
          p.y = c.top + 0.9; vel.y = 0; onGround = true;
        }
      } else if (feetI >= c.top - 0.35) {
        // 屋根への着地（少し低い縁はよじ登り扱いで乗れる）
        if (vel.y <= 0 && prevFeet >= c.top - 0.4 && (r.inside || (vyBefore <= -3 && r.d <= FOOT_R))) {
          if (!r.inside && r.d > 0.001) { p.x = r.cx + (r.cx - p.x) / r.d * 0.03; p.z = r.cz + (r.cz - p.z) / r.d * 0.03; }
          p.y = c.top + 0.9; vel.y = 0; onGround = true;
        }
      } else if (r.d > 0.001) {
        // 壁への側面衝突: 最も近い境界点から半径0.5mの位置まで押し出す
        if (r.inside) {
          const push = r.d + 0.5;
          p.x += (r.cx - p.x) / r.d * push;
          p.z += (r.cz - p.z) / r.d * push;
        } else {
          const push = 0.5 - r.d;
          p.x += (p.x - r.cx) / r.d * push;
          p.z += (p.z - r.cz) / r.d * push;
        }
      }
    }
    // 街路樹の幹にも当たる
    for (const [tx, tz] of treeSpots) {
      const dx = p.x - tx, dz = p.z - tz, d2 = dx * dx + dz * dz;
      if (d2 < 0.49 && d2 > 0.0001 && (p.y - 0.9) < 2.4) {
        const d = Math.sqrt(d2);
        p.x = tx + dx / d * 0.7; p.z = tz + dz / d * 0.7;
      }
    }
  }
  // 着地の衝撃（現実のパルクール基準×1.5）: 落下 約3m超はロールか大きな着地、約8m超は怪我級に崩れる
  if (!wasGround && onGround) {
    const impact = -vyBefore;
    const hSpd = Math.hypot(vel.x, vel.z);
    if (impact >= 5) seLand();
    if (impact >= 11) slideTime = 0;
    const rollPressed = rollBuf > 0; rollBuf = 0;
    if (rollPressed && impact >= 11) {
      // タイミング受け身成功: どれだけ高い落下でも硬直なしでロールに流れる
      rollT = 0.0001; rollDur = 0.5; pendingRecover = 0;
      if (impact >= 15.5) { trick('受け身成功', 150); seCP(); }
    } else if (rollPressed && impact >= 5 && hSpd >= 4) {
      rollT = 0.0001; rollDur = 0.45;
    } else if (impact < 11) {
      if (impact >= 5) landDip = 0.12;
    } else if (impact < 15.5) {
      // 落下 約3〜6m: 前に進んでいればロールで抜ける。止まっていると大きな着地になる
      if (hSpd >= 4) { rollT = 0.0001; rollDur = 0.5; }
      else { recoverT = 0.4; vel.x = 0; vel.z = 0; }
    } else if (impact < 18.2) {
      // 落下 約6〜8m: ロールしても少し崩れる
      if (hSpd >= 4) { rollT = 0.0001; rollDur = 0.55; pendingRecover = 0.3; }
      else { recoverT = 0.8; vel.x = 0; vel.z = 0; }
    } else {
      // 落下 8m超: 現実なら怪我級。大きく崩れて時間を失う
      recoverT = 1.3; vel.x = 0; vel.z = 0;
      document.getElementById('msg').textContent = '落下が大きすぎる！現実なら怪我する高さ。ロールで抜けるか、低いルートで降りて';
    }
  }
  if (onGround) wallRun = 0;
  }
  // 遠くの区画は描かない（移動時の負荷対策。当たり判定は別管理なので影響なし）
  for (const m of buildingChunks) {
    const nx = Math.max(m.userData.minX, Math.min(m.userData.maxX, p.x));
    const nz = Math.max(m.userData.minZ, Math.min(m.userData.maxZ, p.z));
    const dx = nx - p.x, dz = nz - p.z;
    m.visible = dx * dx + dz * dz < 160000; // 最も近い点でも400m先なら霧の向こう
  }
  if (Math.abs(p.x) > 420 || Math.abs(p.z) > 420) { p.x = Math.max(-420, Math.min(420, p.x)); p.z = Math.max(-420, Math.min(420, p.z)); }

  // 状況ヒント（各1回だけ、その場で役立つ出し方を教える）
  if (!tutoredNow && !hintFlags.fall && !onGround && vel.y < -14) {
    hintFlags.fall = 1; showToast('高い落下！着地直前にロールボタンで受け身');
  }
  if (!tutoredNow && !hintFlags.wallrun && wallRun > 0) {
    hintFlags.wallrun = 1; showToast('壁走り中！そのまま走れる。ジャンプで壁ジャンプ');
  }
  if (!tutoredNow && !hintFlags.gap && !onGround && stepTick % 8 === 0) {
    const feetH = player.position.y - 0.9;
    let near = 0;
    for (const c of colliders) {
      if (c.prop || c.aux || c.top - feetH < 2.5) continue;
      if (player.position.x < c.minX - 2.6 || player.position.x > c.maxX + 2.6 || player.position.z < c.minZ - 2.6 || player.position.z > c.maxZ + 2.6) continue;
      const r = distToPoly(player.position.x, player.position.z, c.pts);
      if (!r.inside && r.d < 2.3) near++;
    }
    if (near >= 2) { hintFlags.gap = 1; showToast('壁と壁の隙間！ジャンプを繰り返すと壁キックで登れる'); }
  }

  if (!tutoredNow && hintFlags.fall && hintFlags.wallrun && hintFlags.gap) { store.set(KEY_BASE + '-tutored', '1'); tutoredNow = true; }

  // チェックポイント判定（厳密）: 対象の屋根の上にある柱の場所（リング内）まで来て初めて通過
  if (started && !finished && cpIndex < cps.length) {
    const c = cps[cpIndex];
    const feetY = p.y - 0.9;
    const atSpot = onGround && Math.hypot(p.x - c.x, p.z - c.z) < 2.2 && feetY >= c.top - 0.6 && feetY <= c.top + 2.0;
    if (atSpot) {
      c.done = true; c.mesh.visible = false; cpIndex++;
      updateCpMarkers();
      seCP();
      const elapsed = (performance.now() - startTime) / 1000;
      splits.push(elapsed);
      trick('チェックポイント', 200);
      document.getElementById('cp').textContent = cpIndex + ' / ' + cps.length;
      if (cpIndex === cps.length) {
        finished = true;
        const t = elapsed;
        document.getElementById('msg').textContent = 'ゴール！ ' + t.toFixed(2) + ' 秒 — ↻ボタンでもう一度（ゴーストが出ます）';
        seGoal();
        store.set(KEY_BASE + '-ghost', JSON.stringify(ghostTrail));
        savedGhost = ghostTrail;
        store.set(KEY_BASE + '-tutored', '1'); tutoredNow = true;
        const prevBestRaw = store.get(KEY_BASE + '-best');
        const prevBest = prevBestRaw ? Number(prevBestRaw) : null;
        const isBest = prevBest === null || t < prevBest;
        if (isBest) store.set(KEY_BASE + '-best', String(t));
        showResult(t, prevBest, isBest);
      } else {
        showToast('CP ' + cpIndex + '/' + cps.length + '　' + elapsed.toFixed(2) + '秒');
      }
    }
  }
  if (started && !finished) {
    document.getElementById('time').textContent = ((performance.now() - startTime) / 1000).toFixed(2);
    recordAcc += dt;
    if (recordAcc >= 0.1) { ghostTrail.push([p.x, p.y, p.z]); recordAcc = 0; }
  }
  // ゴースト再生（0.1秒刻みで記録した軌跡を再生）
  if (savedGhost && started && !finished) {
    const i = Math.floor((performance.now() - startTime) / 100);
    if (savedGhost[i]) { ghost.visible = true; ghost.position.set(savedGhost[i][0], savedGhost[i][1], savedGhost[i][2]); }
  }
  const distEl = document.getElementById('cpdist');
  if (cpIndex < cps.length) {
    const nc = cps[cpIndex];
    distEl.textContent = Math.round(Math.hypot(p.x - nc.x, p.z - nc.z)) + 'm';
  } else distEl.textContent = 'ゴール！';
  // カメラ: プレイヤーの周りを周回（ドラッグで回転）
  // 落下中はカメラが少し見下ろし気味になって、着地点が見える
  const fallTarget = (!onGround && vel.y < -5) ? Math.min(1, (-vel.y - 5) / 12) : 0;
  fallLookSm += (fallTarget - fallLookSm) * Math.min(1, dt * 5);
  // カメラ追随アシスト: 走行中にカメラ操作が途切れたら、背後へゆるやかに回り込む
  const hSpdA = Math.hypot(vel.x, vel.z);
  if (started && !finished && hSpdA > 4 && wallRun <= 0 && climbT <= 0 && hangT <= 0 && vaultT <= 0 && performance.now() / 1000 - camTouchT > 1.2) {
    let diff = (Math.atan2(vel.x, vel.z) + Math.PI) - camYaw;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    if (Math.abs(diff) < 1.9) camYaw += diff * Math.min(1, dt * 1.8) * Math.min(1, (hSpdA - 4) / 6);
  }
  const effPitch = camPitch + fallLookSm * 0.38;
  const cx = p.x + Math.sin(camYaw) * Math.cos(effPitch) * CAM_DIST;
  const cz = p.z + Math.cos(camYaw) * Math.cos(effPitch) * CAM_DIST;
  const cy = p.y + 1.6 + Math.sin(effPitch) * CAM_DIST;
  camera.position.lerp(new THREE.Vector3(cx, cy, cz), 1 - Math.exp(-16 * dt)); // フレームレートに依らないなめらかな追従
  // 壁走り中はカメラを少し傾ける
  if (wallRun > 0) camera.up.set(-wallNX * 0.16, 1, -wallNZ * 0.16).normalize();
  else camera.up.set(0, 1, 0);
  camera.lookAt(p.x + vel.x * (0.10 + fallLookSm * 0.22), p.y + 1.6 - fallLookSm * 1.1, p.z + vel.z * (0.10 + fallLookSm * 0.22)); // 進む先を先読み（落下中は着地点寄り）
}

// コース構築（画面遷移なしで切り替える。建物は少しずつ作って固まらないようにする）
let built = false, building = false;
async function buildCourse(key) {
  if (building) return;
  building = true;
  built = false;
  COURSE = key;
  KEY_BASE = key + '-touch'; // コースごとの保存キー（従来の shibuya-touch / hibari-touch と同じ）
  try { savedGhost = JSON.parse(store.get(KEY_BASE + '-ghost') || 'null'); } catch (e) { savedGhost = null; }
  ghost.visible = false;
  clearCourseObjects();
  buildingChunks.length = 0;
  colliders.length = 0;
  roadSegs.length = 0;
  treeSpots = [];
  reachableSet = new Set();
  cps.length = 0;
  spawn = { x: 0, z: 40, top: 0, roof: null };
  const sub = document.querySelector('.course-sub');
  try {
    const data = window.CITY_DATA[key];
    if (!data) throw new Error('no city data');
    const total = data.b.length;
    for (let i = 0; i < total; i++) {
      addBuilding(data.b[i][0], data.b[i][1]);
      if (i % 300 === 299) {
        if (sub) sub.textContent = '街を読み込み中… ' + Math.round((i + 1) / total * 100) + '%';
        await new Promise(r => setTimeout(r, 0));
      }
    }
    finalizeBuildings();
    addAccessFeatures(); // 外階段・ベランダ（登れる足場）を付けてからスポーンやCPを決める
    addRoads(data.r.map(([pts, w, f]) => ({ pts, w, foot: !!f })));
  } catch (err) {
    console.warn(err);
    document.getElementById('msg').textContent = '街データの読み込みに失敗したため、仮の街並みで遊べます';
    for (let i = 0; i < 40; i++) {
      const x = (Math.random() - 0.5) * 600, z = (Math.random() - 0.5) * 600;
      const w = 12 + Math.random() * 18, d = 12 + Math.random() * 18, h = 6 + Math.random() * 14;
      addBuilding([[x - w / 2, z - d / 2], [x + w / 2, z - d / 2], [x + w / 2, z + d / 2], [x - w / 2, z + d / 2]], h);
    }
    finalizeBuildings();
    addRoads([
      { pts: [[-400, 0], [400, 0]], w: 13, foot: false },
      { pts: [[0, -400], [0, 400]], w: 13, foot: false },
      { pts: [[-400, -140], [400, -140]], w: 6.5, foot: false },
      { pts: [[-140, -400], [-140, 400]], w: 6.5, foot: false },
    ]);
  }
  chooseSpawn();
  applySpawn();
  plantTrees();
  placeCheckpoints();
  placeOrbs();
  addProps();
  buildStaticMap();
  flyoverArmed = true; // コースに入ったら、まずルートを一望する
  reset();
  if (sub) sub.textContent = 'コースを選んでスタート（ゴースト・ベストはコース別）';
  document.getElementById('courseName').textContent = COURSE_NAMES[key] || key;
  document.getElementById('btnShibuya').classList.toggle('sel', key === 'shibuya');
  document.getElementById('btnHibari').classList.toggle('sel', key === 'hibari');
  document.getElementById('btnIkebukuro').classList.toggle('sel', key === 'ikebukuro');
  built = true;
  building = false;
}
setTimeout(() => { buildCourse(COURSE); }, 50);

// ミニマップ（左上）: 建物・CP・ゴースト・自分の向き
// ミニマップ用の静止画を最初に1回だけ描く（毎フレーム描くと重いため）
const SM_SIZE = 1024, SM_WORLD = 880, SM_SCALE = SM_SIZE / SM_WORLD;
let staticMap = null;
function buildStaticMap() {
  staticMap = document.createElement('canvas');
  staticMap.width = staticMap.height = SM_SIZE;
  const g = staticMap.getContext('2d');
  const X = wx => (wx + SM_WORLD / 2) * SM_SCALE, Y = wz => (wz + SM_WORLD / 2) * SM_SCALE;
  g.fillStyle = '#10161d';
  g.fillRect(0, 0, SM_SIZE, SM_SIZE);
  // 道路
  g.strokeStyle = '#3d4652';
  g.lineCap = 'round';
  for (const s of roadSegs) {
    g.lineWidth = Math.max(1, s.w * SM_SCALE);
    g.beginPath(); g.moveTo(X(s.ax), Y(s.az)); g.lineTo(X(s.bx), Y(s.bz)); g.stroke();
  }
  // 建物（到達できる屋根は明るく、そうでない建物は暗く）
  for (const c of colliders) {
    if (!c.pts || c.pts.length < 3) continue;
    g.fillStyle = reachableSet.has(c) ? '#93aed6' : '#49525f';
    g.beginPath();
    c.pts.forEach(([wx, wz], i) => i ? g.lineTo(X(wx), Y(wz)) : g.moveTo(X(wx), Y(wz)));
    g.closePath(); g.fill();
  }
  // 範囲の目安: データ境界（半径400m）とCPの出る範囲（スタートから180m）
  g.lineWidth = 2;
  g.setLineDash([8, 6]);
  g.strokeStyle = 'rgba(255,255,255,.35)';
  g.beginPath(); g.arc(X(0), Y(0), 400 * SM_SCALE, 0, 7); g.stroke();
  g.strokeStyle = 'rgba(255,204,0,.45)';
  g.beginPath(); g.arc(X(spawn.x), Y(spawn.z), 180 * SM_SCALE, 0, 7); g.stroke();
  // 順路（スタート→CP1→CP2…）
  if (cps.length) {
    g.strokeStyle = 'rgba(255,204,0,.8)';
    g.lineWidth = 2.5;
    g.setLineDash([10, 7]);
    g.beginPath(); g.moveTo(X(spawn.x), Y(spawn.z));
    for (const c of cps) g.lineTo(X(c.x), Y(c.z));
    g.stroke();
  }
  g.setLineDash([]);
  g.fillStyle = '#39d353';
  g.beginPath(); g.arc(X(spawn.x), Y(spawn.z), 6, 0, 7); g.fill();
}

const mapCtx = document.getElementById('map').getContext('2d');
function drawMap() {
  const ctx = mapCtx, S = 176, C = S / 2;
  const p = player.position;
  ctx.clearRect(0, 0, S, S);
  let toX = wx => C + (wx - p.x) * (C / 150), toY = wz => C + (wz - p.z) * (C / 150);
  if (staticMap) {
    const sw = 300 * SM_SCALE;
    let sx = (p.x + SM_WORLD / 2) * SM_SCALE - sw / 2;
    let sy = (p.z + SM_WORLD / 2) * SM_SCALE - sw / 2;
    sx = Math.max(0, Math.min(SM_SIZE - sw, sx));
    sy = Math.max(0, Math.min(SM_SIZE - sw, sy));
    ctx.drawImage(staticMap, sx, sy, sw, sw, 0, 0, S, S);
    toX = wx => ((wx + SM_WORLD / 2) * SM_SCALE - sx) / sw * S;
    toY = wz => ((wz + SM_WORLD / 2) * SM_SCALE - sy) / sw * S;
  }
  cps.forEach((c, i) => {
    if (c.done) return;
    const x = toX(c.x), y = toY(c.z);
    if (x < -8 || y < -8 || x > S + 8 || y > S + 8) return;
    ctx.fillStyle = '#ffcc00';
    ctx.beginPath(); ctx.arc(x, y, i === cpIndex ? 5 : 3.5, 0, 7); ctx.fill();
    if (i === cpIndex) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(x, y, 8.5, 0, 7); ctx.stroke();
    }
  });
  if (ghost.visible) {
    ctx.fillStyle = 'rgba(90,190,255,.85)';
    ctx.beginPath();
    ctx.arc(toX(ghost.position.x), toY(ghost.position.z), 3, 0, 7);
    ctx.fill();
  }
  const pcx = toX(p.x), pcy = toY(p.z);
  const dx = Math.sin(facing), dz = Math.cos(facing), px = -dz, pz = dx;
  ctx.fillStyle = '#ff5533';
  ctx.beginPath();
  ctx.moveTo(pcx + dx * 8, pcy + dz * 8);
  ctx.lineTo(pcx - dx * 6 + px * 5, pcy - dz * 6 + pz * 5);
  ctx.lineTo(pcx - dx * 6 - px * 5, pcy - dz * 6 - pz * 5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.font = 'bold 11px sans-serif';
  ctx.fillText('N', C - 3, 14);
}

// ---- 全体マップ（ミニマップをタップで全画面表示。ドラッグで移動でき、閉じるのはボタンだけ） ----
let mapOpen = false;
let mapCx = 0, mapCz = 0, mapSpan = 400, mapScale = 1, mapW = 0, mapH = 0;
const bigmapEl = document.getElementById('bigmap');
const bigCanvas = document.getElementById('bigmapCanvas');
const bigCtx = bigCanvas.getContext('2d');
function fitMapView() {
  let minX = spawn.x, maxX = spawn.x, minZ = spawn.z, maxZ = spawn.z;
  for (const c of cps) {
    minX = Math.min(minX, c.x); maxX = Math.max(maxX, c.x);
    minZ = Math.min(minZ, c.z); maxZ = Math.max(maxZ, c.z);
  }
  const p = player.position;
  minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
  minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z);
  const bw = Math.max((maxX - minX) + 110, 170), bh = Math.max((maxZ - minZ) + 110, 170);
  const scale = Math.min(mapW / bw, mapH / bh);
  mapCx = (minX + maxX) / 2; mapCz = (minZ + maxZ) / 2;
  mapSpan = Math.min(mapW, mapH) / scale;
}
function openBigMap() {
  mapOpen = true;
  bigmapEl.style.display = 'block';
  joy.id = null; joy.x = 0; joy.y = 0;
  joyBase.style.display = 'none'; joyKnob.style.display = 'none';
  wantJump = false; wantSlide = false; wantDash = false;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  mapW = bigCanvas.clientWidth || GW(); mapH = bigCanvas.clientHeight || GH();
  bigCanvas.width = Math.round(mapW * dpr); bigCanvas.height = Math.round(mapH * dpr);
  bigCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fitMapView();
  drawBigMap();
}
function closeBigMap() { mapOpen = false; bigmapEl.style.display = 'none'; }
function drawBigMap() {
  if (!mapOpen) return;
  const ctx = bigCtx, W = mapW, H = mapH;
  mapScale = Math.min(W, H) / mapSpan;
  const vx0 = mapCx - (W / 2) / mapScale, vz0 = mapCz - (H / 2) / mapScale;
  ctx.fillStyle = '#10161d';
  ctx.fillRect(0, 0, W, H);
  if (staticMap) {
    const sx0 = (vx0 + SM_WORLD / 2) * SM_SCALE, sy0 = (vz0 + SM_WORLD / 2) * SM_SCALE;
    const sx1 = sx0 + (W / mapScale) * SM_SCALE, sy1 = sy0 + (H / mapScale) * SM_SCALE;
    const csx0 = Math.max(0, sx0), csy0 = Math.max(0, sy0), csx1 = Math.min(SM_SIZE, sx1), csy1 = Math.min(SM_SIZE, sy1);
    if (csx1 > csx0 && csy1 > csy0) {
      ctx.drawImage(staticMap, csx0, csy0, csx1 - csx0, csy1 - csy0,
        (csx0 - sx0) / SM_SCALE * mapScale, (csy0 - sy0) / SM_SCALE * mapScale,
        (csx1 - csx0) / SM_SCALE * mapScale, (csy1 - csy0) / SM_SCALE * mapScale);
    }
  }
  const X = wx => (wx - vx0) * mapScale, Y = wz => (wz - vz0) * mapScale;
  // 順路（スタート→CP1→CP2…）
  ctx.strokeStyle = 'rgba(255,204,0,.85)';
  ctx.lineWidth = 3; ctx.setLineDash([12, 8]);
  ctx.beginPath(); ctx.moveTo(X(spawn.x), Y(spawn.z));
  for (const c of cps) ctx.lineTo(X(c.x), Y(c.z));
  ctx.stroke(); ctx.setLineDash([]);
  // スタート地点
  ctx.fillStyle = '#39d353';
  ctx.beginPath(); ctx.arc(X(spawn.x), Y(spawn.z), 9, 0, 7); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  // CP（番号付き）
  cps.forEach((c, i) => {
    const x = X(c.x), y = Y(c.z);
    if (x < -30 || y < -30 || x > W + 30 || y > H + 30) return;
    ctx.fillStyle = c.done ? '#39d353' : (i === cpIndex ? '#ffcc00' : 'rgba(255,204,0,.6)');
    ctx.beginPath(); ctx.arc(x, y, i === cpIndex ? 17 : 12, 0, 7); ctx.fill();
    ctx.fillStyle = '#10161d';
    ctx.font = 'bold 19px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), x, y);
    if (i === cpIndex) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.stroke(); }
  });
  // 現在地（自分）
  const p = player.position;
  const dx = Math.sin(facing), dz = Math.cos(facing), px = -dz, pz = dx;
  const pcx = X(p.x), pcy = Y(p.z);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.arc(pcx, pcy, 18, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff5533';
  ctx.beginPath();
  ctx.moveTo(pcx + dx * 20, pcy + dz * 20);
  ctx.lineTo(pcx - dx * 15 + px * 12, pcy - dz * 15 + pz * 12);
  ctx.lineTo(pcx - dx * 15 - px * 12, pcy - dz * 15 - pz * 12);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('現在地', pcx, pcy + 34);
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillText('北 ↑', W - 16, 56);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}
// ドラッグで地図を動かす
let mapDrag = null;
bigCanvas.addEventListener('pointerdown', e => {
  e.stopPropagation();
  const g = toGame(e);
  mapDrag = { id: e.pointerId, x: g.x, y: g.y };
  try { bigCanvas.setPointerCapture(e.pointerId); } catch (err) {}
});
bigCanvas.addEventListener('pointermove', e => {
  if (!mapDrag || e.pointerId !== mapDrag.id) return;
  const g = toGame(e);
  mapCx -= (g.x - mapDrag.x) / mapScale;
  mapCz -= (g.y - mapDrag.y) / mapScale;
  mapDrag.x = g.x; mapDrag.y = g.y;
  drawBigMap();
});
const endMapDrag = e => { if (mapDrag && e.pointerId === mapDrag.id) mapDrag = null; };
bigCanvas.addEventListener('pointerup', endMapDrag);
bigCanvas.addEventListener('pointercancel', endMapDrag);
document.getElementById('map').addEventListener('pointerdown', e => { e.stopPropagation(); openBigMap(); });
document.getElementById('bigmapClose').addEventListener('pointerdown', e => { e.stopPropagation(); closeBigMap(); });
document.getElementById('bigmapHere').addEventListener('pointerdown', e => {
  e.stopPropagation();
  mapCx = player.position.x; mapCz = player.position.z;
  drawBigMap();
});
document.getElementById('bigmapZoomIn').addEventListener('pointerdown', e => {
  e.stopPropagation();
  mapSpan = Math.max(60, mapSpan * 0.7); drawBigMap();
});
document.getElementById('bigmapZoomOut').addEventListener('pointerdown', e => {
  e.stopPropagation();
  mapSpan = Math.min(880, mapSpan * 1.4); drawBigMap();
});

// ---- リザルト表示とCPトースト ----
function showToast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}
function showResult(t, prevBest, isBest) {
  document.getElementById('resTime').textContent = t.toFixed(2) + ' 秒';
  document.getElementById('resBest').textContent = isBest
    ? (prevBest !== null ? '🎉 ベスト更新！（前回 ' + prevBest.toFixed(2) + ' 秒）' : '🎉 初ベスト記録！')
    : 'ベスト ' + prevBest.toFixed(2) + ' 秒（あと ' + (t - prevBest).toFixed(2) + ' 秒）';
  let scoreNote = '';
  const prevScoreBest = parseInt(store.get(KEY_BASE + '-bestscore') || '0', 10) || 0;
  if (score > prevScoreBest) { store.set(KEY_BASE + '-bestscore', String(score)); scoreNote = ' ・ 🎉 スコア自己ベスト！'; }
  document.getElementById('resSplits').innerHTML =
    splits.map((s, i) => 'CP' + (i + 1) + '： ' + s.toFixed(2) + ' 秒').join('<br>') +
    '<br>スコア： ' + score.toLocaleString() + ' 点（最大 ' + bestCombo + ' コンボ）' + scoreNote + '<br>オーブ： ' + orbsGot + ' / ' + orbs.length;
  document.getElementById('result').style.display = 'flex';
}
document.getElementById('btnRetry').addEventListener('click', () => {
  document.getElementById('result').style.display = 'none';
  reset();
});
document.getElementById('btnCourse2').addEventListener('click', () => {
  document.getElementById('result').style.display = 'none';
  courseUI.style.display = 'flex';
});

// ---- コース選択 ----
const courseUI = document.getElementById('courseUI');
document.getElementById('courseName').textContent = COURSE_NAMES[COURSE] || COURSE;
document.getElementById({ shibuya: 'btnShibuya', hibari: 'btnHibari', ikebukuro: 'btnIkebukuro' }[COURSE]).classList.add('sel');
async function chooseCourse(c) {
  if (building) return;
  if (c === COURSE) {
    if (built) courseUI.style.display = 'none';
    return;
  }
  store.set('parkour-course', c);
  courseUI.style.display = 'flex';
  await buildCourse(c);
  courseUI.style.display = 'none';
}
document.getElementById('btnShibuya').addEventListener('click', () => chooseCourse('shibuya'));
document.getElementById('btnHibari').addEventListener('click', () => chooseCourse('hibari'));
document.getElementById('btnIkebukuro').addEventListener('click', () => chooseCourse('ikebukuro'));
document.getElementById('courseBtn').addEventListener('click', () => { courseUI.style.display = 'flex'; });

const clock = new THREE.Clock();
let physAcc = 0;
const PHYS_DT = 1 / 120; // 物理は端末のfpsに依らず固定間隔で計算する（ジャンプの届き方が端末で変わらない）
let lastCpHudText = '';
(function loop() {
  requestAnimationFrame(loop);
  const frame = Math.min(clock.getDelta(), 0.1);
  physAcc += frame;
  let n = 0;
  while (physAcc >= PHYS_DT && n < 14) { step(PHYS_DT); physAcc -= PHYS_DT; n++; }
  if (n === 14) physAcc = 0; // 長時間止まった後は溜め込まない
  animatePlayer(frame);
  // 対象CPのリングを脈打たせて目立たせる
  const cur = cps[cpIndex];
  if (cur && cur.ring && cur.ring.visible) {
    const s = 1 + Math.sin(performance.now() * 0.006) * 0.13;
    cur.ring.scale.set(s, s, 1);
  }
  updateWind(frame);
  updateLandRing();
  // オーブ: ふわふわ浮かせて回し、触れたら回収（コンボにも乗る）
  const ot = performance.now() / 1000;
  for (const o of orbs) {
    if (o.taken) continue;
    o.mesh.position.y = o.baseY + Math.sin(ot * 2.2 + o.phase) * 0.25;
    o.mesh.rotation.y = ot * 2 + o.phase;
    if (started && !finished && !flyover) {
      const dx = player.position.x - o.x, dz = player.position.z - o.z;
      if (dx * dx + dz * dz < 1.7 && Math.abs(player.position.y - o.mesh.position.y) < 1.7) {
        o.taken = true; o.mesh.visible = false; orbsGot++;
        combo++; comboT = 4; if (combo > bestCombo) bestCombo = combo;
        score += 50 + (combo - 1) * 10;
        seOrb(); updateScoreHud(); updateOrbHud();
      }
    }
  }
  // HUD: 次のCPまでの距離も出す（変わったときだけ書き換える）
  {
    let txt = cpIndex + ' / ' + cps.length;
    const cN = cps[cpIndex];
    if (cN && started && !finished) txt += ' ・ 次まで ' + Math.max(0, Math.round(Math.hypot(player.position.x - cN.x, player.position.z - cN.z) - 2)) + 'm';
    if (txt !== lastCpHudText) { lastCpHudText = txt; document.getElementById('cp').textContent = txt; }
  }
  drawMap();
  renderer.render(scene, camera);
})();
addEventListener('resize', () => {
  camera.aspect = GW() / GH();
  camera.updateProjectionMatrix();
  renderer.setSize(GW(), GH());
});
</script>
